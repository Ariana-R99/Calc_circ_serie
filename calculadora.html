<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuito en Serie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
</head>
<body>

<div class="bg-info p-2 text-dark bg-opacity-25">
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
      <nav class="navbar fixed-top bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">Circuito en Serie</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
          </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" href="calculadora.html">Calculadora</a>
                </li>
              </ul>
            </div>
        </div>
      </nav>
    </nav>
    
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="container my-4">
        <div class="row">
          <div class="col-md-4">
            <div class="card border-primary mb-3">
              <div class="card-header">Datos</div>
              <div class="card-body text-primary">
                <p class="card-text">
                  <label for="voltajeT">Voltaje Total (V):</label>
              <input type="number" id="voltajeT" required class="form-control mb-2">

              <label for="R1">Resistencia 1 (Ω):</label>
              <input type="number" id="R1" required class="form-control mb-2">

              <label for="R2">Resistencia 2 (Ω):</label>
              <input type="number" id="R2" required class="form-control">
                </p>
              </div>
            </div>
          </div>
      
          <div class="col-md-4">
            <div class="card border-primary mb-3">
              <div class="card-header">Cálculos</div>
              <div class="card-body text-primary">
                <p class="card-text">
                  <div class="btn-group-vertical w-100 mb-3" role="group" aria-label="Vertical button group">
                    <button type="button" class="btn btn-primary" onclick="calcularCorriente()">Calcular Corriente</button>
                  </div>
      
                  <div class="btn-group dropend w-100 mb-3" role="group">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                      Calcular Voltaje
                    </button>
                    <ul class="dropdown-menu">
                      <li><button class="dropdown-item" onclick="calcularVoltaje1()">Voltaje 1</button></li>
                      <li><button class="dropdown-item" onclick="calcularVoltaje2()">Voltaje 2</button></li>
                    </ul>
                  </div>
      
                  <div class="btn-group dropend w-100" role="group">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                      Calcular Potencia
                    </button>
                    <ul class="dropdown-menu">
                      <li><button class="dropdown-item" onclick="calcularPotencia1()">Potencia 1</button></li>
                      <li><button class="dropdown-item" onclick="calcularPotencia2()">Potencia 2</button></li>
                      <li><button class="dropdown-item" onclick="calcularPotenciaEq()">Potencia en RT</button></li>
                    </ul>
                  </div>
                </p>
              </div>
            </div>
          </div>
      
          <div class="col-md-4">
            <div class="card border-primary mb-3">
              <div class="card-header">Resultados</div>
              <div class="card-body text-primary">
                <p class="card-text">
                  <div id="resultado1">
                    <p>Corriente: <span id="corriente"></span> A</p>
                  </div>
      
                  <div id="resultado2">
                    <p>Voltaje 1: <span id="voltaje1"></span> V</p>
                  </div>
      
                  <div id="resultado3">
                    <p>Voltaje 2: <span id="voltaje2"></span> V</p>
                  </div>
      
                  <div>
                    <p>Potencia 1: <span id="potencia1"></span> W</p>
                  </div>
      
                  <div>
                    <p>Potencia 2: <span id="potencia2"></span> W</p>
                  </div>

                  <div>
                    <p>Potencia en RT: <span id="potenciaEq"></span> W</p>
                  </div>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
